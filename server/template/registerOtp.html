<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Your Login OTP</title>
    <style>
      body {
        font-family: 'Segoe UI', Roboto, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 30px 0;
      }
      .container {
        background-color: #ffffff;
        max-width: 600px;
        margin: auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        text-align: center;
      }
      .title {
        color: #007bff;
      }
      .otp {
        font-size: 32px;
        letter-spacing: 4px;
        margin: 20px 0;
        color: #222;
      }
      .footer {
        font-size: 12px;
        color: #999;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="title">Hello, {{name}} 👋. Welcome to swiMate</h2>
      <p>Here’s your One-Time Password (OTP) for login:</p>
      <div class="otp">{{otp}}</div>
      <p>This OTP will expire in 5 minutes.</p>
      <div class="footer">© {{year}} MyApp. All rights reserved.</div>
    </div>
  </body>
</html>
